        <div class="px-40 flex flex-1 justify-center py-5">

                <p class="text-white text-base font-medium leading-normal pb-2">Caption</p>

                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border border-[#53473c] bg-[#26211c] focus:border-[#53473c] h-14 placeholder:text-[#b8ab9d] p-[15px] text-base font-normal leading-normal"

    <script>
  document.addEventListener("DOMContentLoaded", () => {
    const previewDiv = document.querySelector(
      '.layout-content-container .aspect-[3/2] > div'
    );

    const uploadInput = document.querySelector('input[placeholder*="upload"]');
    const captionInput = document.querySelector('input[placeholder="Add a caption"]');
    const dateInput = document.querySelector('input[placeholder="Select date"]');

    const effectCheckboxes = document.querySelectorAll('input[type="checkbox"]');

    // Add overlay for caption/date
    const overlay = document.createElement('div');
    overlay.style.position = 'absolute';
    overlay.style.bottom = '10px';
    overlay.style.left = '10px';
    overlay.style.color = 'white';
    overlay.style.fontSize = '1rem';
    overlay.style.textShadow = '1px 1px 3px black';
    overlay.style.zIndex = '10';
    previewDiv.style.position = 'relative';
    previewDiv.appendChild(overlay);

    function updateOverlay() {
      const caption = captionInput.value.trim();
      const date = dateInput.value.trim();
      overlay.innerHTML = `${caption ? `<p>${caption}</p>` : ''}${date ? `<p>${date}</p>` : ''}`;
    }

    // Handle image upload
    uploadInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        previewDiv.style.backgroundImage = `url(${event.target.result})`;
      };
      reader.readAsDataURL(file);
    });

    // Handle caption & date
    captionInput.addEventListener("input", updateOverlay);
    dateInput.addEventListener("input", updateOverlay);

    // Apply effects
    effectCheckboxes.forEach((checkbox, index) => {
      checkbox.addEventListener("change", () => {
        const effect = ["film-grain", "light-leak", "bw"][index];

        previewDiv.classList.toggle(effect, checkbox.checked);
      });
    });
  });
</script>
