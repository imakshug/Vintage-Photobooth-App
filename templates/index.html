<!DOCTYPE html>
<html>
  <head>
    <title>Vintage Photobooth</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>
    <style>
      .preview-img {
        width: 100%;
        max-width: 480px;
        aspect-ratio: 3/2;
        object-fit: cover;
        border-radius: 12px;
        background: #181411;
        margin-bottom: 1rem;
        transition: filter 0.2s;
      }
      .custom-file-input {
        display: inline-block;
        padding: 10px 20px;
        cursor: pointer;
        background: #b76514;
        color: #fff;
        border-radius: 8px;
        font-weight: bold;
        font-size: 1rem;
        border: none;
        margin-bottom: 1rem;
      }
      .custom-file-input::-webkit-file-upload-button {
        visibility: hidden;
      }
      .custom-file-input::before {
        content: 'Choose File';
        display: inline-block;
        background: #b76514;
        color: #fff;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: bold;
        font-size: 1rem;
        border: none;
        cursor: pointer;
      }
      .custom-file-input:active::before {
        background: #a05412;
      }
      .preview-overlay {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: white;
        font-size: 1.2rem;
        text-shadow: 1px 1px 3px black;
        z-index: 2;
      }
      .preview-container {
        position: relative;
        display: inline-block;
      }
    </style>
  </head>
  <body style="background:#181411;font-family:'Noto Serif','Noto Sans',sans-serif;">

    <div style="max-width:600px;margin:40px auto;padding:32px;background:#26211c;border-radius:16px;box-shadow:0 2px 16px #0002;">
      <h1 style="color:#fff;font-size:2rem;font-weight:bold;margin-bottom:1.5rem;">Vintage Photobooth</h1>
      <form id="photo-form" method="POST" enctype="multipart/form-data" action="/upload">
  <!-- No preview container at the top -->
        <div style="margin-bottom:1rem;">
          <label>Upload Image</label>
          <button type="button" id="custom-file-btn" class="themed-btn">Choose File</button>
          <input type="file" name="photo[]" id="photo-input" accept="image/*" multiple required style="display:none;" />
          <span id="file-name" class="file-name"></span>
        </div>
        <div style="margin-bottom:1rem;">
          <label>Caption</label>
          <input type="text" name="caption" id="caption-input" placeholder="Add a caption" />
        </div>
        <div style="margin-bottom:1rem;">
          <label>Date</label>
          <input type="text" name="date" id="date-input" placeholder="Select date" />
        </div>
        <div class="effects">
          <label><input type="checkbox" name="film_grain" id="film-grain"> Film Grain</label>
          <label><input type="checkbox" name="light_leak" id="light-leak"> Light Leak</label>
          <label><input type="checkbox" name="bw" id="bw"> Black & White</label>
        </div>
        <button type="submit" class="themed-btn">Create Photo</button>
      </form>
      <div class="photo-strip glass">
        <!-- Photo strip will be injected here by JS -->
      </div>
    </div>
